<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>玫瑰的状态 · 参数化生成器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='14' r='9' fill='%23c2334a'/%3E%3Ccircle cx='16' cy='14' r='4.5' fill='%23e8607a'/%3E%3Cpath d='M16 23 L16 31 M16 26 L10 22 M16 26 L22 22' stroke='%234e6b53' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
:root{
  --ink:#E9F0EA;
  --ink-dim:#93A69A;
  --ink-faint:#68796E;
  --line:rgba(196,214,201,.16);
  --line-soft:rgba(196,214,201,.09);
  --accent:#C7D8CB;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(95% 75% at 42% 34%, #1A2822 0%, #14201A 34%, #0C1512 64%, #060A08 100%);
  color:var(--ink);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 392px;height:100svh}

/* ===== 画布区 ===== */
.art{
  position:relative;min-height:0;
  display:flex;flex-direction:column;
  padding:26px 20px 18px 62px;
}
.canvasWrap{
  flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}

canvas#c{display:block;max-width:100%;max-height:100%;filter:drop-shadow(0 20px 50px rgba(0,0,0,.45))}

/* 左侧状态标尺：编码开花度 */
.scale{
  position:absolute;left:54px;top:14%;bottom:22%;width:1px;
  background:linear-gradient(to bottom, transparent, var(--line) 6%, var(--line) 94%, transparent);
}
.scale i{position:absolute;left:-3px;width:6px;height:1px;background:var(--line)}
.scale b{
  position:absolute;left:-42px;transform:translateY(-50%);
  font-weight:400;font-size:10px;letter-spacing:.1em;color:var(--ink-faint);white-space:nowrap;
}
.scale .mark{
  position:absolute;left:-7px;width:15px;height:1px;background:var(--accent);
  box-shadow:0 0 9px rgba(199,216,203,.6);
  transition:top .18s ease;
}
.caption{
  display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;
  font-size:11px;letter-spacing:.05em;color:var(--ink-dim);
  padding:12px 2px 0;
  border-top:1px solid var(--line-soft);
}
.caption em{font-style:italic;font-family:"Noto Serif SC","Songti SC",serif;color:var(--ink);letter-spacing:.02em}
.caption span{color:var(--ink-faint)}

/* ===== 面板 ===== */
.panel{
  border-left:1px solid var(--line-soft);
  padding:34px 34px 26px;
  display:flex;flex-direction:column;gap:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.018), rgba(255,255,255,0));
  overflow-y:auto;
}
.kicker{font-size:10px;letter-spacing:.22em;color:var(--ink-faint)}
h1{
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:600;
  font-size:clamp(28px,3vw,38px);letter-spacing:.08em;line-height:1.15;margin-top:12px;
}
.latin{
  font-family:"Noto Serif SC","Songti SC",serif;font-style:italic;
  font-size:13px;color:var(--ink-dim);letter-spacing:.03em;
  margin-top:9px;padding-bottom:15px;border-bottom:1px solid var(--line-soft);
}
.intro{
  font-size:12.5px;line-height:1.85;color:var(--ink-dim);
  margin-top:15px;font-weight:300;max-width:30em;
}
.group{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row label{font-size:11.5px;letter-spacing:.1em;color:var(--ink-dim)}
.row .val{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink);letter-spacing:.02em}

.varieties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line-soft)}
.varieties button{
  appearance:none;border:0;background:#0D1512;color:var(--ink-dim);
  font-family:inherit;font-size:11.5px;letter-spacing:.05em;
  padding:10px 12px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:9px;
  transition:background .2s ease,color .2s ease;
}
.varieties button i{width:9px;height:9px;flex:0 0 9px;border-radius:50%;border:1px solid rgba(255,255,255,.22)}
.varieties button:hover{background:#122019;color:var(--ink)}
.varieties button[aria-pressed="true"]{background:#1A2A22;color:var(--ink)}
.varieties button[aria-pressed="true"] i{box-shadow:0 0 0 2px rgba(199,216,203,.28)}

input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:9px;height:9px;border-radius:0;background:var(--accent);margin-top:-4px;
  transition:transform .15s ease;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.35)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:0;border:0;background:var(--accent)}
input[type=range]:focus-visible{outline:1px solid var(--accent);outline-offset:4px}

.seedrow{display:flex;align-items:center;gap:10px}
.seedrow input[type=number]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);
  color:var(--ink);font-family:inherit;font-size:11.5px;padding:6px 2px;
  letter-spacing:.06em;font-variant-numeric:tabular-nums;
}
.seedrow input[type=number]:focus{outline:none;border-bottom-color:var(--accent)}
.seedrow input::-webkit-outer-spin-button,
.seedrow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.seedrow button{
  appearance:none;background:none;border:1px solid var(--line);color:var(--ink-dim);
  font-family:inherit;font-size:10.5px;letter-spacing:.1em;padding:7px 12px;cursor:pointer;
  white-space:nowrap;transition:border-color .2s,color .2s;
}
.seedrow button:hover{border-color:var(--accent);color:var(--ink)}

.actions{display:flex;gap:10px;padding-top:2px}
.actions button{
  flex:1;appearance:none;background:transparent;border:1px solid var(--line);
  color:var(--ink);font-family:inherit;font-size:11.5px;letter-spacing:.08em;
  padding:10px;cursor:pointer;transition:border-color .2s,background .2s;
}
.actions button:hover{border-color:var(--accent);background:rgba(199,216,203,.06)}
.actions .ghost{color:var(--ink-dim)}
.actions .ghost:hover{color:var(--ink)}

.codeWrap{border-top:1px solid var(--line-soft);padding-top:15px}
.codeHead{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;letter-spacing:.14em;color:var(--ink-faint)}
.codeHead button{appearance:none;background:none;border:0;color:var(--ink-faint);font-family:inherit;font-size:10.5px;letter-spacing:.1em;cursor:pointer;padding:3px 0}
.codeHead button:hover{color:var(--accent)}
pre{
  margin-top:8px;font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  font-size:10.5px;line-height:1.8;color:#A9BDB0;white-space:pre;overflow-x:auto;
}
pre .k{color:#7E948A}
pre .s{color:#D9BA90}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
  background:#16261F;border:1px solid var(--line);color:var(--ink);
  font-size:11.5px;letter-spacing:.08em;padding:9px 17px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:980px){
  .stage{grid-template-columns:1fr;height:auto;min-height:100svh}
  .art{padding:16px 16px 10px 56px}
  .canvasWrap{aspect-ratio:1/1;flex:none;width:100%}
  canvas#c{max-height:100%}
  .scale{left:20px;top:10%;bottom:16%}
  .scale b{display:none}
  .caption{font-size:10px;gap:10px}
  .caption .plateTag{display:none}
  .panel{border-left:0;border-top:1px solid var(--line-soft);padding:28px 22px 34px;gap:20px;overflow:visible}
  h1{font-size:29px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="stage">
  <div class="art">
    <div class="scale" id="scale">
      <i style="top:0"></i><i style="top:25%"></i><i style="top:50%"></i><i style="top:75%"></i><i style="top:100%"></i>
      <b style="top:0">花苞</b>
      <b style="top:25%">初绽</b>
      <b style="top:50%">半开</b>
      <b style="top:75%">盛开</b>
      <b style="top:100%">盛极</b>
      <span class="mark" id="mark" style="top:62%"></span>
    </div>

    <div class="canvasWrap">
      <canvas id="c"></canvas>
    </div>

    <div class="caption">
      <em id="capName">Rosa gallica</em>
      <span id="capState">开度 62% · 花瓣 32 · 卷曲 38%</span>
      <span class="plateTag">plate 01 / 参数化生成</span>
    </div>
  </div>

  <aside class="panel">
    <div>
      <div class="kicker">参数化植物形态</div>
      <h1>玫瑰的状态</h1>
      <div class="latin" id="latinName">Rosa gallica</div>
      <p class="intro">花瓣按黄金角 137.5° 由内向外螺旋排布。决定一朵玫瑰长成什么样，只有五个参数：品种、开度、瓣数、卷曲度、随机种子。改动任意一个，都是一朵新的花。</p>
    </div>

    <div class="group"><div class="varieties" id="varieties"></div></div>

    <div class="group">
      <div class="row"><label for="bloom">开度</label><span class="val" id="bloomVal">62%</span></div>
      <input type="range" id="bloom" min="2" max="100" value="62">
    </div>

    <div class="group">
      <div class="row"><label for="petals">花瓣数</label><span class="val" id="petalsVal">32</span></div>
      <input type="range" id="petals" min="20" max="52" step="1" value="32">
    </div>

    <div class="group">
      <div class="row"><label for="curl">卷曲度</label><span class="val" id="curlVal">38%</span></div>
      <input type="range" id="curl" min="0" max="100" value="38">
    </div>

    <div class="group">
      <div class="row"><label for="seed">随机种子</label><span class="val">seed</span></div>
      <div class="seedrow">
        <input type="number" id="seed" value="4821" min="1" max="99999">
        <button id="reseed">换一朵</button>
      </div>
    </div>

    <div class="codeWrap">
      <div class="codeHead"><span>当前参数 / params</span><button id="copy">复制</button></div>
      <pre id="paramJson"></pre>
    </div>

    <div class="actions">
      <button id="export">导出 PNG</button>
      <button class="ghost" id="reset">复位</button>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   玫瑰状态生成器
   绘制坐标系固定 1000×1000，只依赖参数，便于按任意尺寸重绘
   ============================================================ */

const VAR = {
  red: { name:'红玫瑰', latin:"Rosa gallica", dot:'#c2334a',
    shade:'hsl(350 72% 17%)', base:'hsl(352 84% 37%)', mid:'hsl(353 88% 51%)', tip:'hsl(356 92% 68%)',
    edge:'rgba(255,206,208,.55)' },
  white: { name:'白玫瑰', latin:"Rosa 'Alba Maxima'", dot:'#efeee6',
    shade:'hsl(40 9% 36%)', base:'hsl(44 12% 71%)', mid:'hsl(46 19% 87%)', tip:'hsl(48 26% 98%)',
    edge:'rgba(246,246,236,.5)' },
  pink: { name:'粉玫瑰', latin:"Rosa 'Blush Damask'", dot:'#e79aab',
    shade:'hsl(338 26% 42%)', base:'hsl(341 44% 65%)', mid:'hsl(344 56% 79%)', tip:'hsl(346 66% 91%)',
    edge:'rgba(255,238,242,.55)' },
  champagne: { name:'香槟玫瑰', latin:"Rosa 'Champagne'", dot:'#dcb887',
    shade:'hsl(32 26% 40%)', base:'hsl(36 36% 60%)', mid:'hsl(39 46% 75%)', tip:'hsl(43 56% 88%)',
    edge:'rgba(255,243,220,.5)' }
};

const state = { variety:'red', bloom:0.62, petals:32, curl:0.38, seed:4821 };
const live  = Object.assign({}, state);

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const GOLDEN = 2.399963229728653;

/* ---------- 单片花瓣轮廓 ---------- */
function petalPath(c2d, len, halfW, curl, phase){
  const seg = 20;
  const endT = 0.97;
  const tipShift = curl * len * 0.32;
  const L = [], R = [];
  for (let i = 0; i <= seg; i++){
    const u = (i / seg) * endT;
    const shape = Math.pow(Math.sin(Math.PI * u), 0.50) * (1 - 0.06 * u);
    const wob = 1 + 0.042 * Math.sin(u * Math.PI * 1.9 + phase) * Math.min(1, u * 3.4);
    const w = halfW * shape * wob;
    const y = -len * u;
    const off = tipShift * u * u;
    L.push([-w + off, y]);
    R.push([ w + off, y]);
  }
  const shoulderL = L[L.length - 1], shoulderR = R[R.length - 1];
  const notch = tipShift;
  const tipY = -len * 0.995;
  c2d.beginPath();
  c2d.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) c2d.lineTo(L[i][0], L[i][1]);
  // 左肩 → 左尖
  c2d.quadraticCurveTo(shoulderL[0] - halfW * 0.03, tipY, notch - halfW * 0.09, tipY);
  // 中间浅凹口
  c2d.quadraticCurveTo(notch, -len * 0.962, notch + halfW * 0.09, tipY);
  // 右尖 → 右肩
  c2d.quadraticCurveTo(shoulderR[0] + halfW * 0.03, tipY, shoulderR[0], shoulderR[1]);
  for (let i = R.length - 2; i >= 0; i--) c2d.lineTo(R[i][0], R[i][1]);
  c2d.closePath();
  return tipShift;
}

/* ---------- 花瓣着色 ---------- */
function drawPetal(c2d, len, halfW, curl, phase, col, depth, warm, lit){
  const tipShift = petalPath(c2d, len, halfW, curl, phase);

  const g = c2d.createLinearGradient(0, 0, tipShift, -len);
  g.addColorStop(0,    col.shade);
  g.addColorStop(0.30, col.base);
  g.addColorStop(0.66, col.mid);
  g.addColorStop(1,    col.tip);
  c2d.fillStyle = g;

  // 投影：上层花瓣压在下层之上
  c2d.save();
  c2d.shadowColor = 'rgba(0,0,0,.50)';
  c2d.shadowBlur = 22;
  c2d.shadowOffsetY = 9;
  c2d.fill();
  c2d.restore();

  c2d.save();
  petalPath(c2d, len, halfW, curl, phase);
  c2d.clip();

  // 横向明暗：花瓣像一片卷起的曲面，一侧受光一侧背光
  const hg = c2d.createLinearGradient(-halfW, 0, halfW, 0);
  const edgeDark = 0.06 + 0.16 * curl;
  hg.addColorStop(0,    'rgba(0,0,0,' + edgeDark + ')');
  hg.addColorStop(0.22, 'rgba(0,0,0,0)');
  hg.addColorStop(0.50, 'rgba(255,255,255,' + (0.09 + 0.07 * curl) + ')');
  hg.addColorStop(0.78, 'rgba(0,0,0,0)');
  hg.addColorStop(1,    'rgba(0,0,0,' + edgeDark + ')');
  c2d.fillStyle = hg;
  c2d.fillRect(-len * 1.2, -len * 1.2, len * 2.4, len * 2.4);

  // 方向光：朝光源一侧的花瓣整体提亮
  if (lit > 0){
    c2d.fillStyle = 'rgba(255,252,238,' + (0.22 * lit) + ')';
  } else {
    c2d.fillStyle = 'rgba(0,0,0,' + (0.19 * -lit) + ')';
  }
  c2d.fillRect(-len * 1.2, -len * 1.2, len * 2.4, len * 2.4);

  // 瓣根暗部
  const rg = c2d.createRadialGradient(0, 0, 0, 0, 0, len * 0.76);
  rg.addColorStop(0, 'rgba(0,0,0,' + (0.36 * depth) + ')');
  rg.addColorStop(0.55, 'rgba(0,0,0,' + (0.13 * depth) + ')');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  c2d.fillStyle = rg;
  c2d.fillRect(-len * 1.2, -len * 1.2, len * 2.4, len * 2.4);

  // 瓣尖卷边：翻折出来的浅色带
  const bg2 = c2d.createLinearGradient(0, -len * 0.62, 0, -len);
  bg2.addColorStop(0, 'rgba(255,255,255,0)');
  bg2.addColorStop(1, 'rgba(255,250,240,' + (0.10 + 0.16 * warm) + ')');
  c2d.fillStyle = bg2;
  c2d.fillRect(-len * 1.2, -len * 1.2, len * 2.4, len * 1.2);

  c2d.restore();

  // 边缘细光
  petalPath(c2d, len, halfW, curl, phase);
  c2d.strokeStyle = col.edge;
  c2d.globalAlpha = 0.45;
  c2d.lineWidth = 0.75;
  c2d.stroke();
  c2d.globalAlpha = 1;
}

/* ---------- 茎与叶 ---------- */
function drawStem(c2d){
  const path = (w) => {
    c2d.lineWidth = w; c2d.lineCap = 'round';
    c2d.beginPath();
    c2d.moveTo(500, 620);
    c2d.bezierCurveTo(526, 748, 448, 850, 342, 1020);
    c2d.stroke();
  };
  c2d.strokeStyle = 'hsl(142 16% 10%)'; path(21);
  c2d.strokeStyle = 'hsl(138 18% 19%)'; path(15);
  c2d.strokeStyle = 'hsl(134 13% 27%)'; path(5);
}

function drawLeaf(c2d, x, y, ang, len, wid, flip){
  c2d.save();
  c2d.translate(x, y); c2d.rotate(ang); c2d.scale(flip ? -1 : 1, 1);
  const pts = [];
  for (let i = 0; i <= 24; i++){
    const u = i / 24;
    let ww = wid * Math.pow(Math.sin(Math.PI * u), 0.55) * (1 - 0.18 * u);
    ww += wid * 0.07 * Math.sin(u * Math.PI * 8) * (u < 0.9 ? 1 : 0);
    pts.push([len * u, ww]);
  }
  c2d.beginPath();
  c2d.moveTo(0, 0);
  for (const [px, py] of pts) c2d.lineTo(px, -py);
  for (let i = pts.length - 1; i >= 0; i--) c2d.lineTo(pts[i][0], pts[i][1]);
  c2d.closePath();

  const g = c2d.createLinearGradient(0, -wid, len, wid);
  g.addColorStop(0, 'hsl(140 17% 12%)');
  g.addColorStop(0.45, 'hsl(136 20% 22%)');
  g.addColorStop(1, 'hsl(128 16% 31%)');
  c2d.fillStyle = g;
  c2d.fill();
  c2d.strokeStyle = 'rgba(186,210,186,.16)';
  c2d.lineWidth = 0.8;
  c2d.stroke();

  c2d.beginPath();
  c2d.moveTo(0, 0);
  c2d.quadraticCurveTo(len * 0.5, wid * 0.08, len * 0.97, 0);
  c2d.strokeStyle = 'rgba(196,220,196,.2)';
  c2d.lineWidth = 1.1;
  c2d.stroke();
  c2d.restore();
}

/* ---------- 花托与萼片 ---------- */
function drawSepals(c2d, open, y){
  c2d.beginPath();
  c2d.ellipse(500, y, 44, 38, 0, 0, Math.PI * 2);
  const g = c2d.createLinearGradient(468, y - 40, 540, y + 40);
  g.addColorStop(0, 'hsl(140 20% 23%)');
  g.addColorStop(1, 'hsl(138 16% 11%)');
  c2d.fillStyle = g;
  c2d.fill();

  const n = 5, spread = 0.30 + 0.55 * open;
  for (let i = 0; i < n; i++){
    c2d.save();
    c2d.translate(500, y - 6);
    c2d.rotate((i - (n - 1) / 2) * 0.60 * spread + 0.08);
    const L = 118 - 32 * open, W = 16;
    c2d.beginPath();
    c2d.moveTo(0, 0);
    c2d.quadraticCurveTo(W, -L * 0.55, 1, -L);
    c2d.quadraticCurveTo(-W, -L * 0.55, 0, 0);
    c2d.closePath();
    const sg = c2d.createLinearGradient(0, 0, 0, -L);
    sg.addColorStop(0, 'hsl(140 18% 16%)');
    sg.addColorStop(0.55, 'hsl(136 21% 25%)');
    sg.addColorStop(1, 'hsl(130 19% 34%)');
    c2d.fillStyle = sg;
    c2d.fill();
    c2d.strokeStyle = 'rgba(190,212,190,.2)';
    c2d.lineWidth = 0.8;
    c2d.stroke();
    c2d.restore();
  }
}

/* ---------- 花 ---------- */
function drawFlower(c2d, s){
  const cx = 500;
  const R  = 248;
  const open = s.bloom;
  const grow = 0.62 + 0.38 * open;
  const cy = 606 - grow * R * 0.93;
  const baseY = cy + grow * R * 0.90;
  const col  = VAR[s.variety];
  const rnd  = mulberry32(s.seed);

  c2d.save();
  c2d.translate(cx, cy);
  c2d.rotate(-0.05);
  c2d.scale(1, 0.94 + 0.16 * (1 - open));
  c2d.translate(-cx, -cy);

  drawSepals(c2d, open, baseY);

  const n = s.petals;
  const list = [];
  for (let k = 0; k < n; k++){
    const t = k / (n - 1);
    const j1 = rnd() - 0.5, j2 = rnd() - 0.5;
    const ph = rnd() * Math.PI * 2;
    const ang = k * GOLDEN + j1 * 0.26;
    const rOut = R * (0.17 + 0.83 * Math.pow(t, 0.82)) * grow * (0.96 + 0.04 * open) + j2 * 16 * grow;
    const baseOff = R * 0.48 * Math.pow(t, 1.9) * open;
    list.push({ t, ang, rOut, baseOff, ph });
  }
  list.sort((a, b) => b.t - a.t);

  for (const p of list){
    const len = Math.max(10, p.rOut - p.baseOff);
    const halfW = len * (0.41 + 0.10 * p.t) * (0.55 + 0.45 * open);
    const curl = s.curl * (0.55 + 0.45 * open);
    const depth = 0.40 + 0.60 * p.t;
    const warm = Math.max(0, 1 - p.t * 2.6);
    const lit = Math.cos(p.ang + 0.87) * 0.9;

    c2d.save();
    c2d.translate(cx, cy);
    c2d.rotate(p.ang);
    c2d.translate(0, -p.baseOff);
    c2d.scale(1, 1 - 0.16 * open * p.t);
    drawPetal(c2d, len, halfW, curl, p.ph, col, depth, warm, lit);
    c2d.restore();
  }

  // 花心
  const rg = c2d.createRadialGradient(cx, cy, 0, cx, cy, 24);
  const heartA = 0.10 + 0.34 * open;
  rg.addColorStop(0, 'rgba(0,0,0,' + heartA + ')');
  rg.addColorStop(0.6, 'rgba(0,0,0,' + (heartA * 0.33) + ')');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  c2d.fillStyle = rg;
  c2d.beginPath();
  c2d.arc(cx, cy, 24, 0, Math.PI * 2);
  c2d.fill();

  c2d.strokeStyle = col.edge;
  c2d.globalAlpha = 0.3;
  c2d.lineWidth = 1;
  for (let i = 0; i < 3; i++){
    c2d.beginPath();
    const a0 = i * 1.5 + 0.35;
    for (let j = 0; j <= 22; j++){
      const u = j / 22;
      const a = a0 + u * 2.0;
      const r = 7 + u * 26;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.85;
      j ? c2d.lineTo(x, y) : c2d.moveTo(x, y);
    }
    c2d.stroke();
  }
  c2d.globalAlpha = 1;

  // 花心的一点点暖光
  const hw = c2d.createRadialGradient(cx, cy, 0, cx, cy, 22);
  hw.addColorStop(0, s.variety === 'white' ? 'rgba(224,226,176,.30)' : 'rgba(255,196,142,.26)');
  hw.addColorStop(1, 'rgba(255,200,150,0)');
  c2d.fillStyle = hw;
  c2d.beginPath();
  c2d.arc(cx, cy, 22, 0, Math.PI * 2);
  c2d.fill();

  c2d.restore();
}

/* ---------- 场景 ---------- */
function drawScene(c2d, size, s, withBg){
  const k = size / 1000;
  c2d.setTransform(k, 0, 0, k, 0, 0);
  c2d.clearRect(0, 0, 1000, 1000);

  if (withBg){
    const bg = c2d.createRadialGradient(500, 380, 40, 500, 480, 760);
    bg.addColorStop(0, '#18241F');
    bg.addColorStop(0.5, '#101917');
    bg.addColorStop(1, '#060A08');
    c2d.fillStyle = bg;
    c2d.fillRect(0, 0, 1000, 1000);

    const glow = c2d.createRadialGradient(450, 280, 10, 450, 280, 500);
    glow.addColorStop(0, 'rgba(216,234,220,.15)');
    glow.addColorStop(0.5, 'rgba(180,205,190,.045)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    c2d.fillStyle = glow;
    c2d.fillRect(0, 0, 1000, 1000);
  }

  drawStem(c2d);
  drawLeaf(c2d, 452, 762, -0.55, 148, 50, false);
  drawLeaf(c2d, 470, 878, 0.5, 126, 43, true);

  drawFlower(c2d, s);

  if (withBg){
    const vin = c2d.createRadialGradient(500, 480, 320, 500, 480, 720);
    vin.addColorStop(0, 'rgba(0,0,0,0)');
    vin.addColorStop(1, 'rgba(0,0,0,.5)');
    c2d.fillStyle = vin;
    c2d.fillRect(0, 0, 1000, 1000);
  }
}

/* ---------- 尺寸与渲染循环 ---------- */
const wrap = canvas.parentElement;
let needsDraw = true;

function resize(){
  const r = wrap.getBoundingClientRect();
  const side = Math.max(200, Math.floor(Math.min(r.width, r.height)));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.style.width = side + 'px';
  canvas.style.height = side + 'px';
  canvas.width = Math.round(side * dpr);
  canvas.height = Math.round(side * dpr);
  needsDraw = true;
}

let raf = 0;
function loop(){
  let moving = false;
  for (const key of ['bloom', 'curl']){
    const d = state[key] - live[key];
    if (Math.abs(d) > 0.0015){ live[key] += d * 0.18; moving = true; }
    else live[key] = state[key];
  }
  if (Math.abs(state.petals - live.petals) >= 1){
    live.petals += (state.petals - live.petals) * 0.22;
    if (Math.abs(state.petals - live.petals) < 1) live.petals = state.petals;
    moving = true;
  }
  live.petals = Math.round(live.petals);
  live.variety = state.variety;
  live.seed = state.seed;

  if (moving || needsDraw){
    drawScene(ctx, canvas.width, live, false);
    needsDraw = false;
  }
  raf = requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
const varietiesEl = document.getElementById('varieties');
Object.entries(VAR).forEach(([key, v]) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.dataset.key = key;
  b.setAttribute('aria-pressed', key === state.variety ? 'true' : 'false');
  b.innerHTML = '<i style="background:' + v.dot + '"></i>' + v.name;
  b.addEventListener('click', () => {
    state.variety = key;
    [...varietiesEl.children].forEach(el => el.setAttribute('aria-pressed', el.dataset.key === key ? 'true' : 'false'));
    document.getElementById('latinName').textContent = VAR[key].latin;
    needsDraw = true;
    syncReadout();
  });
  varietiesEl.appendChild(b);
});

const bloomEl = document.getElementById('bloom');
const petalsEl = document.getElementById('petals');
const curlEl = document.getElementById('curl');
const seedEl = document.getElementById('seed');
const markEl = document.getElementById('mark');
const jsonEl = document.getElementById('paramJson');

bloomEl.addEventListener('input', () => { state.bloom = +bloomEl.value / 100; syncReadout(); });
petalsEl.addEventListener('input', () => { state.petals = +petalsEl.value; syncReadout(); });
curlEl.addEventListener('input', () => { state.curl = +curlEl.value / 100; syncReadout(); });
seedEl.addEventListener('change', () => {
  const v = Math.max(1, Math.min(99999, parseInt(seedEl.value, 10) || 1));
  seedEl.value = v; state.seed = v; needsDraw = true; syncReadout();
});

document.getElementById('reseed').addEventListener('click', () => {
  const keys = Object.keys(VAR);
  state.variety = keys[Math.floor(Math.random() * keys.length)];
  [...varietiesEl.children].forEach(el => el.setAttribute('aria-pressed', el.dataset.key === state.variety ? 'true' : 'false'));
  document.getElementById('latinName').textContent = VAR[state.variety].latin;
  state.seed = 1 + Math.floor(Math.random() * 90000);   seedEl.value = state.seed;
  state.bloom = 0.15 + Math.random() * 0.8;             bloomEl.value = Math.round(state.bloom * 100);
  state.petals = 20 + Math.floor(Math.random() * 33);   petalsEl.value = state.petals;
  state.curl = Math.round(Math.random() * 100) / 100;   curlEl.value = Math.round(state.curl * 100);
  needsDraw = true;
  syncReadout();
});

document.getElementById('reset').addEventListener('click', () => {
  Object.assign(state, { variety:'red', bloom:0.62, petals:32, curl:0.38, seed:4821 });
  bloomEl.value = 62; petalsEl.value = 32; curlEl.value = 38; seedEl.value = 4821;
  document.getElementById('latinName').textContent = VAR.red.latin;
  [...varietiesEl.children].forEach(el => el.setAttribute('aria-pressed', el.dataset.key === 'red' ? 'true' : 'false'));
  needsDraw = true;
  syncReadout();
});

function stateLabel(v){
  if (v < 0.15) return '花苞';
  if (v < 0.38) return '初绽';
  if (v < 0.62) return '半开';
  if (v < 0.85) return '盛开';
  return '盛极';
}

function syncReadout(){
  document.getElementById('bloomVal').textContent = Math.round(state.bloom * 100) + '%';
  document.getElementById('petalsVal').textContent = state.petals;
  document.getElementById('curlVal').textContent = Math.round(state.curl * 100) + '%';
  markEl.style.top = (state.bloom * 100) + '%';
  document.getElementById('capName').textContent = VAR[state.variety].latin;
  document.getElementById('capState').textContent =
    stateLabel(state.bloom) + ' · 开度 ' + Math.round(state.bloom * 100) + '% · 花瓣 ' + state.petals + ' · 卷曲 ' + Math.round(state.curl * 100) + '%';
  jsonEl.innerHTML =
    '<span class="k">variety</span>: <span class="s">"' + VAR[state.variety].latin + '"</span>,\n' +
    '<span class="k">bloom</span>: ' + state.bloom.toFixed(2) + ',\n' +
    '<span class="k">petals</span>: ' + state.petals + ',\n' +
    '<span class="k">curl</span>: ' + state.curl.toFixed(2) + ',\n' +
    '<span class="k">seed</span>: ' + state.seed;
}

/* ---------- 导出 ---------- */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1600);
}

document.getElementById('export').addEventListener('click', () => {
  const size = 1600;
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  drawScene(off.getContext('2d'), size, state, true);
  const a = document.createElement('a');
  a.download = 'rose_' + state.variety + '_' + Math.round(state.bloom * 100) + '_s' + state.seed + '.png';
  a.href = off.toDataURL('image/png');
  a.click();
  toast('已导出 1600 × 1600 PNG');
});

document.getElementById('copy').addEventListener('click', async () => {
  const txt = JSON.stringify({
    variety: VAR[state.variety].latin,
    bloom: +state.bloom.toFixed(2),
    petals: state.petals,
    curl: +state.curl.toFixed(2),
    seed: state.seed
  }, null, 2);
  try { await navigator.clipboard.writeText(txt); toast('参数已复制'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    ta.remove(); toast('参数已复制');
  }
});

/* ---------- 启动 ---------- */
new ResizeObserver(resize).observe(wrap);
window.addEventListener('resize', resize);
resize();
syncReadout();
drawScene(ctx, canvas.width, state, false);
loop();
</script>
